# Test profile — H2 in-memory, no external Postgres needed.
spring:
  datasource:
    url: jdbc:h2:mem:quizez;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

quizez:
  jwt:
    issuer: quizez-test
    secret: test-secret-key-32-bytes-minimum-length
