spring:
  application:
    name: quizez-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quizez}
    username: ${SPRING_DATASOURCE_USERNAME:quizez}
    password: ${SPRING_DATASOURCE_PASSWORD:quizez}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

quizez:
  jwt:
    issuer: ${JWT_ISSUER:quizez}
    secret: ${JWT_SECRET:change-me-32-byte-minimum-secret-key}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
